[project]
name = "money-talks-bot"
requires-python = ">=3.11"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.pylint.main]
py-version = "3.11"
init-hook = 'import sys; sys.path.append(".")'

[tool.pylint.format]
max-line-length = 100

[tool.pylint.design]
max-args = 10
max-returns = 8
max-branches = 15

[tool.pylint.messages_control]
disable = [
  "missing-module-docstring",
  "missing-class-docstring",
  "missing-function-docstring",
  "too-few-public-methods",
  "too-many-arguments",
  "too-many-instance-attributes",
  "duplicate-code",
  "import-outside-toplevel",
]

[tool.pylint.typecheck]
generated-members = ["google.*", "genai.*"]

[tool.pylint.basic]
good-names = ["i", "j", "k", "ex", "_", "df", "db"]
